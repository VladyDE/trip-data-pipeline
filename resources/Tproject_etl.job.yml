resources:
  jobs:
    tproject_gold_job:
      name: tproject_gold_job

      trigger:
        periodic:
          interval: 1
          unit: DAYS
      
      parameters:
      - name: catalog
        default: ${var.catalog}
      - name: schema
        default: ${var.schema}

      tasks:
        - task_key: gold_trips_obt
          sql_task:
            file:
              path: ../gold/gold_trips_obt.sql
            warehouse_id: 016ceb1f62938957

        - task_key: gold_daily_trips
          depends_on:
            - task_key: gold_trips_obt
          sql_task:
            file:
              path: ../gold/gold_trips_daily.sql
            warehouse_id: 016ceb1f62938957